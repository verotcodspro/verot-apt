name: Build VEROT APT Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

      - name: Download VEROT package
        run: |
          mkdir -p packages
          wget -O packages/verot-package.deb \
            https://github.com/verotcodspro/verot/raw/main/verot-package.deb

      - name: Create APT repository
        run: |
          mkdir -p apt-repo/conf

          cat > apt-repo/conf/distributions <<'EOF'
          Origin: VEROT
          Label: VEROT
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: VEROT Programming Language APT Repository
          EOF

          reprepro -b apt-repo includedeb stable packages/verot-package.deb

      - name: Create index
        run: |
          cat > apt-repo/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>VEROT APT Repository</title>
          </head>
          <body>
            <h1>VEROT APT Repository</h1>
            <p>Official APT repository for VEROT.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-repo

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
